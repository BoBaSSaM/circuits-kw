openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: catalog
    description: Public catalog operations
  - name: orders
    description: Checkout and order management
  - name: admin
    description: Protected dashboard operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /catalog:
    get:
      operationId: getCatalog
      tags: [catalog]
      summary: Get active catalog items
      responses:
        "200":
          description: Active components and project kits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogResponse"
  /users/me:
    put:
      operationId: syncCurrentUser
      tags: [admin]
      summary: Sync the signed-in Clerk profile
      responses:
        "200":
          description: Profile stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orders:
    get:
      operationId: getMyOrders
      tags: [orders]
      summary: List the signed-in buyer's demo orders
      responses:
        "200":
          description: Demo orders belonging to the signed-in buyer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountOrderListResponse"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Orders could not be loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createCheckoutOrder
      tags: [orders]
      summary: Place a demo order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutOrderInput"
      responses:
        "201":
          description: Order saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutOrderResponse"
        "400":
          description: Invalid checkout details or items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Order could not be saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/access:
    get:
      operationId: getAdminAccess
      tags: [admin]
      summary: Get the signed-in user's dashboard role
      responses:
        "200":
          description: Current profile and access role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccessResponse"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/catalog:
    get:
      operationId: getAdminCatalog
      tags: [admin]
      summary: Get all catalog items for management
      responses:
        "200":
          description: Components and project kits, including inactive items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogResponse"
        "403":
          description: Dashboard access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/products:
    post:
      operationId: createProduct
      tags: [admin]
      summary: Create a component
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Component created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogProduct"
        "400":
          description: Invalid component
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Dashboard access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/products/{id}:
    patch:
      operationId: updateProduct
      tags: [admin]
      summary: Update a component
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Updated component
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogProduct"
        "404":
          description: Component not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteProduct
      tags: [admin]
      summary: Delete a component
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Component deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
  /admin/project-kits:
    post:
      operationId: createProjectKit
      tags: [admin]
      summary: Create a project kit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectKitInput"
      responses:
        "201":
          description: Project kit created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogKit"
        "400":
          description: Invalid project kit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Dashboard access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/project-kits/{id}:
    patch:
      operationId: updateProjectKit
      tags: [admin]
      summary: Update a project kit
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectKitUpdate"
      responses:
        "200":
          description: Updated project kit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogKit"
        "404":
          description: Project kit not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteProjectKit
      tags: [admin]
      summary: Delete a project kit
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Project kit deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
  /admin/users:
    get:
      operationId: getAdminUsers
      tags: [admin]
      summary: List account profiles
      responses:
        "200":
          description: User profiles and dashboard roles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/users/{id}:
    patch:
      operationId: updateUserRole
      tags: [admin]
      summary: Change a user's dashboard role
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRoleUpdate"
      responses:
        "200":
          description: Updated user role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserRoleResponse"
        "403":
          description: Admin access required or last admin cannot be removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/orders:
    get:
      operationId: getAdminOrders
      tags: [admin]
      summary: List saved orders
      responses:
        "200":
          description: Orders for dashboard management
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderListResponse"
        "403":
          description: Dashboard access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createAdminOrder
      tags: [admin]
      summary: Add a demo order from the dashboard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutOrderInput"
      responses:
        "201":
          description: Order saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOrder"
        "403":
          description: Dashboard access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/orders/{id}:
    patch:
      operationId: updateAdminOrder
      tags: [admin]
      summary: Update order status and internal notes
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminOrderUpdate"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOrder"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteAdminOrder
      tags: [admin]
      summary: Delete an order
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Order deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    DashboardRole:
      type: string
      enum: [customer, editor, admin]
    OrderStatus:
      type: string
      enum: [new, confirmed, preparing, completed, cancelled]
    CatalogProduct:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        sku: { type: string }
        category: { type: string }
        price: { type: number }
        stock: { type: integer }
        package: { type: string }
        description: { type: string }
        voltage: { type: string }
        interface: { type: string }
        icon: { type: string, enum: [cpu, sensor, power, display, board, parts] }
        imageUrl: { type: ["string", "null"] }
        isActive: { type: boolean }
      required: [id, name, sku, category, price, stock, package, description, voltage, interface, icon, imageUrl, isActive]
    CatalogKit:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        title: { type: string }
        category: { type: string }
        level: { type: string, enum: [Beginner, Intermediate, Advanced, "All levels"] }
        domain: { type: string }
        duration: { type: string }
        price: { type: number }
        desc: { type: string }
        parts: { type: array, items: { type: string } }
        count: { type: string }
        manual: { type: string }
        icon: { type: string, enum: [weather, robot, energy, lab, plant, logic] }
        isActive: { type: boolean }
      required: [id, code, title, category, level, domain, duration, price, desc, parts, count, manual, icon, isActive]
    CatalogResponse:
      type: object
      properties:
        products: { type: array, items: { $ref: "#/components/schemas/CatalogProduct" } }
        kits: { type: array, items: { $ref: "#/components/schemas/CatalogKit" } }
      required: [products, kits]
    ProductInput:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        sku: { type: string, minLength: 2, maxLength: 80 }
        category: { type: string, minLength: 2, maxLength: 80 }
        price: { type: number, minimum: 0, maximum: 1000000 }
        stock: { type: integer, minimum: 0, maximum: 10000000 }
        package: { type: string, maxLength: 100 }
        description: { type: string, minLength: 2, maxLength: 2000 }
        voltage: { type: string, maxLength: 120 }
        interface: { type: string, maxLength: 160 }
        icon: { type: string, enum: [cpu, sensor, power, display, board, parts] }
        imageUrl: { type: ["string", "null"], maxLength: 2048 }
        isActive: { type: boolean }
      required: [name, sku, category, price, stock, package, description, voltage, interface, icon, imageUrl, isActive]
    ProductUpdate:
      allOf:
        - $ref: "#/components/schemas/ProductInput"
      description: Complete replacement for the editable component fields.
    ProjectKitInput:
      type: object
      properties:
        code: { type: string, minLength: 2, maxLength: 80 }
        title: { type: string, minLength: 2, maxLength: 120 }
        category: { type: string, minLength: 2, maxLength: 80 }
        level: { type: string, enum: [Beginner, Intermediate, Advanced, "All levels"] }
        domain: { type: string, minLength: 2, maxLength: 80 }
        duration: { type: string, maxLength: 80 }
        price: { type: number, minimum: 0, maximum: 1000000 }
        desc: { type: string, minLength: 2, maxLength: 2000 }
        parts: { type: array, items: { type: string }, maxItems: 100 }
        count: { type: string, maxLength: 80 }
        manual: { type: string, maxLength: 240 }
        icon: { type: string, enum: [weather, robot, energy, lab, plant, logic] }
        isActive: { type: boolean }
      required: [code, title, category, level, domain, duration, price, desc, parts, count, manual, icon, isActive]
    ProjectKitUpdate:
      allOf:
        - $ref: "#/components/schemas/ProjectKitInput"
      description: Complete replacement for the editable project kit fields.
    UserProfile:
      type: object
      properties:
        id: { type: string }
        email: { type: ["string", "null"] }
        firstName: { type: ["string", "null"] }
        lastName: { type: ["string", "null"] }
        role: { $ref: "#/components/schemas/DashboardRole" }
        createdAt: { type: string, format: date-time }
        lastSyncedAt: { type: string, format: date-time }
      required: [id, email, firstName, lastName, role, createdAt, lastSyncedAt]
    UserListResponse:
      type: object
      properties:
        users: { type: array, items: { $ref: "#/components/schemas/UserProfile" } }
      required: [users]
    UserRoleUpdate:
      type: object
      properties:
        role: { $ref: "#/components/schemas/DashboardRole" }
      required: [role]
    UserRoleResponse:
      type: object
      properties:
        id: { type: string }
        role: { $ref: "#/components/schemas/DashboardRole" }
      required: [id, role]
    AdminAccessResponse:
      type: object
      properties:
        id: { type: string }
        email: { type: ["string", "null"] }
        name: { type: ["string", "null"] }
        role: { $ref: "#/components/schemas/DashboardRole" }
      required: [id, email, name, role]
    CurrentUserResponse:
      type: object
      properties:
        ok: { type: boolean }
        role: { $ref: "#/components/schemas/DashboardRole" }
      required: [ok, role]
    OrderItemInput:
      type: object
      properties:
        id: { type: string, minLength: 1, maxLength: 120 }
        kind: { type: string, enum: [component, kit, bom] }
        sku: { type: string, minLength: 1, maxLength: 80 }
        qty: { type: integer, minimum: 1, maximum: 999 }
        estimateUnitPrice: { type: number, minimum: 0, maximum: 1000000 }
      required: [id, kind, sku, qty]
    OrderItem:
      type: object
      properties:
        id: { type: string }
        kind: { type: string, enum: [component, kit, bom] }
        sku: { type: string }
        name: { type: string }
        price: { type: number }
        qty: { type: integer }
      required: [id, kind, sku, name, price, qty]
    OrderCustomer:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        phone: { type: string, minLength: 8, maxLength: 24 }
      required: [name, email, phone]
    OrderShipping:
      type: object
      properties:
        governorate: { type: string, minLength: 2, maxLength: 80 }
        area: { type: string, minLength: 1, maxLength: 100 }
        block: { type: string, minLength: 1, maxLength: 40 }
        street: { type: string, minLength: 1, maxLength: 120 }
        building: { type: string, minLength: 1, maxLength: 80 }
        unit: { type: string, maxLength: 80 }
        notes: { type: string, maxLength: 1000 }
      required: [governorate, area, block, street, building]
    CheckoutOrderInput:
      type: object
      properties:
        customer: { $ref: "#/components/schemas/OrderCustomer" }
        shipping: { $ref: "#/components/schemas/OrderShipping" }
        items: { type: array, items: { $ref: "#/components/schemas/OrderItemInput" }, minItems: 1, maxItems: 100 }
      required: [customer, shipping, items]
    CheckoutOrderResponse:
      type: object
      properties:
        id: { type: string }
        orderNumber: { type: string }
        placedAt: { type: string, format: date-time }
        items: { type: array, items: { $ref: "#/components/schemas/OrderItem" } }
        subtotal: { type: number }
        status: { $ref: "#/components/schemas/OrderStatus" }
      required: [id, orderNumber, placedAt, items, subtotal, status]
    AccountOrder:
      type: object
      properties:
        id: { type: string }
        orderNumber: { type: string }
        placedAt: { type: string, format: date-time }
        items: { type: array, items: { $ref: "#/components/schemas/OrderItem" } }
        subtotal: { type: number }
        isDemo: { type: boolean, const: true }
      required: [id, orderNumber, placedAt, items, subtotal, isDemo]
    AccountOrderListResponse:
      type: object
      properties:
        orders: { type: array, items: { $ref: "#/components/schemas/AccountOrder" } }
      required: [orders]
    AdminOrder:
      type: object
      properties:
        id: { type: string }
        orderNumber: { type: string }
        placedAt: { type: string, format: date-time }
        items: { type: array, items: { $ref: "#/components/schemas/OrderItem" } }
        subtotal: { type: number }
        status: { $ref: "#/components/schemas/OrderStatus" }
        customer: { $ref: "#/components/schemas/OrderCustomer" }
        shipping: { $ref: "#/components/schemas/OrderShipping" }
        userId: { type: ["string", "null"] }
        adminNotes: { type: ["string", "null"] }
      required: [id, orderNumber, placedAt, items, subtotal, status, customer, shipping, userId, adminNotes]
    OrderListResponse:
      type: object
      properties:
        orders: { type: array, items: { $ref: "#/components/schemas/AdminOrder" } }
      required: [orders]
    AdminOrderUpdate:
      type: object
      properties:
        status: { $ref: "#/components/schemas/OrderStatus" }
        adminNotes: { type: ["string", "null"], maxLength: 1000 }
      required: [status, adminNotes]
    DeleteResponse:
      type: object
      properties:
        deleted: { type: boolean }
      required: [deleted]


kind = "web"
previewPath = "/"
title = "Circuits KW"
description = "A Kuwait-focused electronics storefront for components, project kits, build guidance, and a persistent KWD shopping cart."
version = "1.0.0"
id = "artifacts/voltiva-store"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19607

[services.development]
run = "pnpm --filter @workspace/voltiva-store run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/voltiva-store", "run", "build" ]
serve = "static"
publicDir = "artifacts/voltiva-store/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19607"
BASE_PATH = "/"

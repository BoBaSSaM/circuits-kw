kind = "web"
previewPath = "/"
title = "Circuits KW"
description = "A Kuwait-focused electronics storefront for components, project kits, build guidance, and a persistent KWD shopping cart."
version = "1.0.0"
id = "artifacts/voltiva-store"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19607

[services.development]
run = "npm run dev --workspace=@workspace/voltiva-store"

[services.production.build]
args = ["npm", "run", "build", "--workspace=@workspace/voltiva-store"]

[services.production.build.env]
NODE_ENV = "production"
BASE_PATH = "/"

[services.production.run]
args = ["npm", "run", "start", "--workspace=@workspace/voltiva-store"]

[services.production.run.env]
NODE_ENV = "production"
PORT = "19607"

[services.env]
PORT = "19607"
BASE_PATH = "/"

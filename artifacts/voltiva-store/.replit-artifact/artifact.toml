kind = "web"
previewPath = "/"
title = "Voltiva Electronics"
description = "A Kuwait-focused electronics components storefront with a searchable catalog, project kits, build guidance, bilingual-ready information, and a persistent shopping cart."
version = "1.0.0"
id = "artifacts/voltiva-store"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19607

[services.development]
run = "pnpm --filter @workspace/voltiva-store run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/voltiva-store", "run", "build" ]
serve = "static"
publicDir = "artifacts/voltiva-store/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19607"
BASE_PATH = "/"
